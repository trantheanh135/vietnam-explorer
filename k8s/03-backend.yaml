# Requires Secret "vietnam-explorer-secret" (keys POSTGRES_PASSWORD, APP_ADMIN_PASSWORD,
# APP_JWT_SECRET; optional APP_VIDEO_BLOB_TOKEN, APP_VIDEO_GEMINI_API_KEY), created out-of-band, not in git.
# The image tag is updated automatically by .github/workflows/backend.yml.
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: vietnam-explorer
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8085
      targetPort: 8085
      nodePort: 30885
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: vietnam-explorer
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vietnam-explorer
spec:
  replicas: 1
  strategy:
    type: Recreate   # the uploads volume is ReadWriteOnce
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001   # the image's "app" user, so it can write to the uploads volume
      containers:
        - name: backend
          image: ghcr.io/trantheanh135/vietnam-explorer-backend:fa78c2a80f6b378e31dc415e5d089f70410aab1c
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: vietnam-explorer-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: vietnam-explorer-secret, key: POSTGRES_PASSWORD}
            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: vietnam-explorer-secret, key: APP_ADMIN_PASSWORD}
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef: {name: vietnam-explorer-secret, key: APP_JWT_SECRET}
            # AI video: both optional — generation is switched on once both keys exist.
            - name: APP_VIDEO_BLOB_TOKEN
              valueFrom:
                secretKeyRef: {name: vietnam-explorer-secret, key: APP_VIDEO_BLOB_TOKEN, optional: true}
            - name: APP_VIDEO_GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: vietnam-explorer-secret, key: APP_VIDEO_GEMINI_API_KEY, optional: true}
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8085}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8085}
            initialDelaySeconds: 90
            periodSeconds: 10
          resources:
            requests: {memory: 320Mi, cpu: 100m}
            limits: {memory: 640Mi, cpu: 1000m}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
