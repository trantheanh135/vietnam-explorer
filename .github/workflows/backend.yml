name: Backend — test, build image, deploy

# On every push to main that touches backend/: run the tests, build and push the image to
# ghcr.io, then pin the new image tag in k8s/03-backend.yaml. ArgoCD (app "vietnam-explorer")
# watches k8s/ and rolls the change out to the cluster.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: write    # commit the new image tag
  packages: write    # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vietnam-explorer-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -q test
        working-directory: backend

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pin the new image in k8s/
        run: |
          sed -i "s|image: .*vietnam-explorer-backend.*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/03-backend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/03-backend.yaml
          git commit -m "Deploy backend ${GITHUB_SHA::7}" || exit 0
          git pull --rebase origin main
          git push
