# Defaults are for local development (H2 file database, no Postgres needed).
# In k8s the ConfigMap/Secret override these through environment variables.
server:
  port: 8085
  forward-headers-strategy: none

spring:
  application:
    name: vietnam-explorer-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-me}
    ttl-hours: 12
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,https://vietnam-explorer-nu.vercel.app}
  uploads:
    dir: ${APP_UPLOADS_DIR:./data/uploads}
    max-bytes: 8388608
  video:
    gemini-api-key: ${APP_VIDEO_GEMINI_API_KEY:}
    gemini-base-url: https://generativelanguage.googleapis.com
    model: ${APP_VIDEO_MODEL:veo-3.1-lite-generate-preview}
    resolution: 720p
    duration-seconds: 8
    price-per-second: ${APP_VIDEO_PRICE_PER_SECOND:0.05}   # Veo 3.1 Lite, 720p (Google price list, Oct 2026)
    daily-limit: ${APP_VIDEO_DAILY_LIMIT:10}
    blob-token: ${APP_VIDEO_BLOB_TOKEN:}
    blob-api-url: https://vercel.com/api/blob
    timeout-minutes: 15
    poll-ms: 10000
